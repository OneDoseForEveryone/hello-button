# Deploys the files at the repository root to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Lets this workflow publish the site. id-token proves the deploy came from Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time. A deploy that already started is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is the repository root (index.html lives here).
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
